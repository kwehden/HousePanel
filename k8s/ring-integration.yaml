apiVersion: apps/v1
kind: Deployment
metadata:
  name: housepanel-ring-integration
  namespace: housepanel
  labels:
    app: housepanel-ring-integration
    app.kubernetes.io/part-of: housepanel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: housepanel-ring-integration
  template:
    metadata:
      labels:
        app: housepanel-ring-integration
    spec:
      serviceAccountName: housepanel-ring-integration
      automountServiceAccountToken: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["amd64"]
      containers:
        - name: ring-integration
          image: laminarflow:30500/housepanel/ring-integration:0.2.0
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "ring_integration.main:app", "--host", "0.0.0.0", "--port", "8005"]
          ports:
            - containerPort: 8005
          envFrom:
            - secretRef:
                name: housepanel-ring-secrets
          env:
            - name: PYTHONPATH
              value: "/app/src"
            - name: AGGREGATOR_URL
              value: "http://housepanel-aggregator:8001"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8005
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8005
            initialDelaySeconds: 30
            periodSeconds: 30
---
# Exists purely so the ServiceMonitor has a target to scrape; nothing routes
# traffic here.
apiVersion: v1
kind: Service
metadata:
  name: housepanel-ring-integration
  namespace: housepanel
  labels:
    app.kubernetes.io/part-of: housepanel
    housepanel.io/metrics: "true"
spec:
  type: ClusterIP
  selector:
    app: housepanel-ring-integration
  ports:
    - name: http
      port: 8005
      targetPort: 8005
