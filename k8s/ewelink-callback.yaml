apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: housepanel-ewelink-oauth
  namespace: housepanel
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: housepanel-ewelink-callback
  namespace: housepanel
  labels:
    app.kubernetes.io/part-of: housepanel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: housepanel-ewelink-callback
  template:
    metadata:
      labels:
        app: housepanel-ewelink-callback
        app.kubernetes.io/part-of: housepanel
    spec:
      # The fixed callback URL needs a node port outside the NodePort range.
      # Kubernetes traffic uses standpunkt's 10G LAN interface exclusively.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 15
      nodeSelector:
        kubernetes.io/hostname: standpunkt
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: outdoor-collector
          image: laminarflow:30500/housepanel/ewelink-callback@sha256:70c3417b3e57934c3791f1ee37c5d82aea011593b487ff55cdd43a2e8763358c
          imagePullPolicy: IfNotPresent
          command: [python, /app/collector.py]
          env:
            - name: EWELINK_DEVICE_ID
              value: a4400440c8
            - name: TRANSPORT_URL
              value: http://housepanel-transport-adapter:8002
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: oauth
              mountPath: /data
            - name: credentials
              mountPath: /credentials
              readOnly: true
        - name: callback
          image: laminarflow:30500/housepanel/ewelink-callback@sha256:70c3417b3e57934c3791f1ee37c5d82aea011593b487ff55cdd43a2e8763358c
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8765
          env:
            - name: BIND_HOST
              value: "192.168.1.101"
            - name: REDIRECT_URL
              value: http://standpunkt:8765/ewelink/callback
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          volumeMounts:
            - name: oauth
              mountPath: /data
            - name: credentials
              mountPath: /credentials
              readOnly: true
      volumes:
        - name: oauth
          persistentVolumeClaim:
            claimName: housepanel-ewelink-oauth
        - name: credentials
          secret:
            secretName: housepanel-ewelink-credentials
            optional: true
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: housepanel-ewelink-callback
  namespace: housepanel
spec:
  selector:
    app: housepanel-ewelink-callback
  ports:
    - name: http
      port: 8765
      targetPort: http
